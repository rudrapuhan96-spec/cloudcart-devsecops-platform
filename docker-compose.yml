services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: cloudcart
      MYSQL_USER: cloudcart
      MYSQL_PASSWORD: cloudcart_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password

    ports:
      - "3307:3306"

    volumes:
      - cloudcart_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_dev_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile

    env_file:
      - ./app/backend/.env

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: cloudcart
      DB_PASSWORD: cloudcart_dev_password
      DB_NAME: cloudcart

    ports:
      - "4000:4000"

    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile


    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend

volumes:
  cloudcart_mysql_data:

